<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- ここからコピー -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<title>ブラント健康管理</  title>
<!-- ここまでコピー -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
        <!-- ヘッダー -->
        <header class="bg-blue-600 text-white p-6 rounded-b-3xl shadow-md">
            <h1 class="text-2xl font-bold text-center">健康管理アプリ</h1>
            <p class="text-center text-blue-100 text-sm mt-1">日々の変化を記録しましょう</p>
        </header>

        <!-- メインコンテンツ -->
        <main class="p-4 space-y-6">
            
            <!-- 入力フォーム -->
            <section class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 text-gray-700 flex items-center">
                    <span class="mr-2">📝</span> 今日の記録
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">日付</label>
                        <input type="date" id="inputDate" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">体重 (kg)</label>
                            <input type="number" id="weight" step="0.1" placeholder="60.0" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">摂取カロリー (kcal)</label>
                            <input type="number" id="calories" placeholder="2000" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <button onclick="saveData()" id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-sm flex justify-center items-center">
                        記録を保存する
                    </button>
                </div>
            </section>

            <!-- グラフセクション -->
            <section class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">📈 推移グラフ</h2>
                <div class="relative h-64">
                    <canvas id="healthChart"></canvas>
                </div>
            </section>

            <!-- 履歴リスト -->
            <section class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">📅 最近の履歴</h2>
                <div id="historyList" class="space-y-2">
                    <p class="text-center text-gray-400 py-4">データ取得中...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- メッセージボックス -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl hidden opacity-0 transition-opacity duration-300 z-50">
        メッセージ
    </div>

    <script>
        // --- 設定 ---
        // ここをご自身のGASのウェブアプリURLに差し替えてください
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbykdOPUVJpjbTxQBX71TfZ7ewYA_SiLDjvHYxe5xPXlyJMWlaNUwJbLtqDPD8iweIHTwQ/exec'; 

        let healthChart = null;

        // 初期化
        window.onload = () => {
            // 今日の日付を初期値にセット
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
            
            fetchData();
        };

        // メッセージ表示関数
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden', 'bg-red-500', 'bg-gray-800');
            toast.classList.add(isError ? 'bg-red-500' : 'bg-gray-800');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        // データの取得と反映
        async function fetchData() {
            if (GAS_URL.includes('YOUR_GAS')) {
                showToast("GASのURLを設定してください", true);
                return;
            }

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    updateChart(data);
                    updateHistory(data);
                } else {
                    document.getElementById('historyList').innerHTML = '<p class="text-center text-gray-400 py-4">データがありません</p>';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showToast("データの取得に失敗しました", true);
            }
        }

        // データの保存
        async function saveData() {
            const date = document.getElementById('inputDate').value;
            const weight = document.getElementById('weight').value;
            const calories = document.getElementById('calories').value;
            const btn = document.getElementById('saveBtn');

            if (!date || !weight || !calories) {
                showToast("すべての項目を入力してください", true);
                return;
            }

            // ボタンを無効化（二重送信防止）
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                // GASへのPOST送信 (実際にはno-corsの制限回避のため、URLSearchParams等を使用)
                const params = new URLSearchParams({
                    date: date,
                    weight: weight,
                    calories: calories
                });

                await fetch(`${GAS_URL}?${params.toString()}`, {
                    method: 'POST',
                    mode: 'no-cors' 
                });

                showToast("保存しました！");
                
                // 入力欄をクリア（日付以外）
                document.getElementById('weight').value = '';
                document.getElementById('calories').value = '';
                
                // 保存後に最新データを再取得してグラフを更新
                setTimeout(fetchData, 1000); 

            } catch (error) {
                console.error('Save error:', error);
                showToast("保存に失敗しました", true);
            } finally {
                btn.disabled = false;
                btn.textContent = "記録を保存する";
            }
        }

        // グラフの更新
        function updateChart(data) {
            // 日付順にソート（スプレッドシートの並び順に依存しないように）
            const sortedData = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // 直近14日間分に絞る
            const recentData = sortedData.slice(-14);

            const labels = recentData.map(d => {
                const dt = new Date(d.date);
                return `${dt.getMonth() + 1}/${dt.getDate()}`;
            });
            const weightData = recentData.map(d => d.weight);
            const calData = recentData.map(d => d.calories);

            const ctx = document.getElementById('healthChart').getContext('2d');
            
            if (healthChart) {
                healthChart.destroy();
            }

            healthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '体重 (kg)',
                            data: weightData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            yAxisID: 'yWeight',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '食事 (kcal)',
                            data: calData,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            yAxisID: 'yCal',
                            tension: 0.3,
                            borderDash: [5, 5]
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        yWeight: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'kg' }
                        },
                        yCal: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'kcal' }
                        }
                    }
                }
            });
        }

        // 履歴リストの更新
        function updateHistory(data) {
            const list = document.getElementById('historyList');
            // 逆順（新しい順）に表示
            const displayData = [...data].reverse().slice(0, 7);
            
            list.innerHTML = displayData.map(d => {
                const dt = new Date(d.date);
                return `
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                        <div class="font-medium text-gray-700">${dt.getMonth() + 1}/${dt.getDate()}</div>
                        <div class="flex space-x-4">
                            <span class="text-blue-600 font-bold">${d.weight} <span class="text-xs font-normal text-gray-400">kg</span></span>
                            <span class="text-orange-500 font-bold">${d.calories} <span class="text-xs font-normal text-gray-400">kcal</span></span>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
