<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラント健康管理アプリ - Shared</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg-light: #f8fafc; }
        body { background-color: var(--bg-light); font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 1rem; padding: 1.25rem; }
        .btn-check { display: none; }
        .btn-check:checked + label { background-color: var(--primary); color: white; border-color: var(--primary); }
        .input-pill { border: 2px solid #e2e8f0; border-radius: 0.5rem; padding: 0.5rem; width: 100%; text-align: center; font-size: 1rem; }
        .poop-level-1 { border-left: 8px solid #22c55e; }
        .poop-level-2 { border-left: 8px solid #eab308; }
        .poop-level-3 { border-left: 8px solid #f97316; }
        .poop-level-4 { border-left: 8px solid #ef4444; }
        .tab-active { border-bottom: 3px solid var(--primary); color: var(--primary); }
        .chart-container { position: relative; height: 180px; width: 100%; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; border-radius: 0.5rem; overflow: hidden; }
        .calendar-day { background: white; min-height: 80px; padding: 4px; display: flex; flex-direction: column; font-size: 0.7rem; position: relative; }
        .calendar-header { background: #f1f5f9; font-weight: bold; padding: 8px 0; text-align: center; font-size: 0.7rem; }
        .calendar-day.today { background: #eef2ff; }
        .calendar-day.today span.day-num { background: var(--primary); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .cal-event-item { font-size: 0.6rem; line-height: 1.2; margin-top: 2px; padding: 1px 3px; border-radius: 3px; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 2px; }
        .bg-ev-chemo { background-color: #fee2e2; color: #991b1b; }
        .bg-ev-test { background-color: #dbeafe; color: #1e40af; }
        .bg-ev-hosp { background-color: #dcfce7; color: #166534; }
        .time-input { font-size: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px; width: 70px; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body class="pb-24">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        <p class="mt-4 text-indigo-600 font-bold">通信中...</p>
    </div>

    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🐶 ブラント健康管理</h1>
            <button onclick="fetchAllData()" class="text-xs bg-indigo-500 px-2 py-1 rounded">更新 🔄</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div class="flex mb-4 bg-white rounded-lg p-1 shadow-sm">
            <button onclick="switchTab('input')" id="tab-input" class="flex-1 py-2 text-center font-bold tab-active">入力</button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-center font-bold text-gray-500">履歴・統計</button>
        </div>

        <div id="section-input">
            <div class="flex justify-between items-center mb-4">
                <input type="date" id="target-date" class="font-bold text-lg bg-transparent border-none focus:ring-0">
            </div>

            <!-- Events -->
            <div class="card border-2 border-indigo-200">
                <h3 class="font-bold text-indigo-700 mb-3 flex items-center">🗓️ 予定・イベント</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between gap-2 bg-red-50 p-2 rounded-lg">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="event-chemo" class="w-4 h-4 text-red-600">
                            <label for="event-chemo" class="text-sm font-bold text-red-800">💊 抗がん剤</label>
                        </div>
                        <input type="time" id="event-chemo-time" class="time-input">
                    </div>
                    <div class="flex items-center justify-between gap-2 bg-blue-50 p-2 rounded-lg">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="event-test" class="w-4 h-4 text-blue-600">
                            <label for="event-test" class="text-sm font-bold text-blue-800">🏥 検査日</label>
                        </div>
                        <input type="time" id="event-test-time" class="time-input">
                    </div>
                    <div class="flex items-center justify-between gap-2 bg-green-50 p-2 rounded-lg">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="event-hospital" class="w-4 h-4 text-green-600">
                            <label for="event-hospital" class="text-sm font-bold text-green-800">🩺 通院日</label>
                        </div>
                        <input type="time" id="event-hospital-time" class="time-input">
                    </div>
                </div>
            </div>

            <!-- Weight & Temperature -->
            <div class="card">
                <h3 class="font-bold text-indigo-700 mb-3">⚖️ 体重 & 🌡️ 体温</h3>
                <div class="flex gap-4 mb-4">
                    <div class="flex-1">
                        <label class="text-[10px] text-gray-400">体重 (kg)</label>
                        <input type="number" step="0.01" id="weight" class="input-pill" placeholder="0.00">
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <div class="text-center"><label class="text-[10px] text-gray-400">朝</label><input type="number" step="0.1" id="temp-morning" class="input-pill text-sm px-1"></div>
                    <div class="text-center"><label class="text-[10px] text-gray-400">昼</label><input type="number" step="0.1" id="temp-noon" class="input-pill text-sm px-1"></div>
                    <div class="text-center"><label class="text-[10px] text-gray-400">夕</label><input type="number" step="0.1" id="temp-evening" class="input-pill text-sm px-1"></div>
                    <div class="text-center"><label class="text-[10px] text-gray-400">夜</label><input type="number" step="0.1" id="temp-night" class="input-pill text-sm px-1"></div>
                </div>
            </div>

            <!-- Food (Sasami) -->
            <div class="card">
                <h3 class="font-bold text-indigo-700 mb-3">🍖 食事記録 (g)</h3>
                <div class="space-y-3" id="food-container"></div>
            </div>

            <!-- Elimination -->
            <div class="card">
                <h3 class="font-bold text-indigo-700 mb-3">🚽 排泄記録</h3>
                <div class="space-y-2 mb-4" id="urine-container"></div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="checkbox" id="stool-morning" class="btn-check"><label for="stool-morning" class="border-2 text-center py-2 rounded-lg text-sm cursor-pointer">朝の便</label>
                    <input type="checkbox" id="stool-evening" class="btn-check"><label for="stool-evening" class="border-2 text-center py-2 rounded-lg text-sm cursor-pointer">夕の便</label>
                </div>
                <select id="stool-condition" class="input-pill mt-3 text-sm">
                    <option value="1">1. 普通 (緑)</option>
                    <option value="2">2. 少し軟らかい (黄)</option>
                    <option value="3">3. 軟便 (橙)</option>
                    <option value="4">4. 下痢 (赤)</option>
                </select>
            </div>

            <!-- Memo -->
            <div class="card">
                <h3 class="font-bold text-indigo-700 mb-2">📝 メモ</h3>
                <textarea id="daily-memo" class="w-full border-2 border-gray-100 rounded-lg p-2 text-sm outline-none" rows="3"></textarea>
            </div>

            <button onclick="saveData()" id="save-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg mb-10">
                スプレッドシートに保存
            </button>
        </div>

        <div id="section-history" class="hidden">
            <div class="card">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="font-bold text-indigo-600">＜</button>
                    <h3 id="calendar-title" class="font-bold"></h3>
                    <button onclick="changeMonth(1)" class="font-bold text-indigo-600">＞</button>
                </div>
                <div class="calendar-grid" id="calendar-grid"></div>
            </div>
            
            <div class="card">
                <h3 class="font-bold text-indigo-700 mb-3">📊 食事量推移</h3>
                <div class="chart-container"><canvas id="healthChart"></canvas></div>
            </div>

            <div id="history-list" class="space-y-4"></div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-2 rounded-full opacity-0 transition-opacity"></div>

    <script>
        /** IMPORTANT: GASのURLをここに貼り付けてください **/
        const GAS_URL = "https://script.google.com/macros/s/AKfycbygFgKAFeLPTY2g1Hk5x2My4TP_4yubKmtnRZrR8T8gYD-ckNPjXk1jm2Bc6Txiv9VxOg/exec";

        const times = ['morning', 'noon', 'evening', 'night'];
        const timeLabels = {morning:'朝', noon:'昼', evening:'夕方', night:'夜'};
        let allRecords = [];
        let calendarDate = new Date();
        let chartObj = null;

        function initUI() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;

            const foodContainer = document.getElementById('food-container');
            foodContainer.innerHTML = times.map(t => `
                <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 mb-2">
                    <div class="flex justify-between mb-2">
                        <span class="text-xs font-bold text-indigo-700">${timeLabels[t]}</span>
                        <div class="flex items-center gap-1">
                            <input type="checkbox" id="food-${t}-done" class="btn-check"><label for="food-${t}-done" class="border px-2 py-0.5 rounded-full text-[10px] bg-white cursor-pointer">完食</label>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="food-${t}-qty" class="input-pill text-xs py-1" placeholder="通常フード(g)">
                        <input type="number" id="food-${t}-sasami" class="input-pill text-xs py-1 border-orange-200" placeholder="ささみ(g)">
                    </div>
                </div>
            `).join('');

            const urineContainer = document.getElementById('urine-container');
            urineContainer.innerHTML = times.map(t => `
                <div class="flex justify-between items-center text-xs">
                    <span>${timeLabels[t]}の尿</span>
                    <div class="flex gap-2">
                        <label class="flex items-center gap-1"><input type="radio" name="urine-${t}" value="normal" checked> 正常</label>
                        <label class="flex items-center gap-1 text-red-500"><input type="radio" name="urine-${t}" value="abnormal"> 異常</label>
                    </div>
                </div>
            `).join('');
        }

        async function fetchAllData() {
            if (!GAS_URL || GAS_URL.includes("YOUR_GAS")) return;
            showLoading(true);
            try {
                const res = await fetch(GAS_URL);
                allRecords = await res.json();
                allRecords.sort((a,b) => a.id.localeCompare(b.id));
                loadDateData(document.getElementById('target-date').value);
                renderHistory();
            } catch (e) {
                showToast("データ取得に失敗しました");
            } finally {
                showLoading(false);
            }
        }

        async function saveData() {
            if (!GAS_URL || GAS_URL.includes("YOUR_GAS")) {
                showToast("GASのURLが設定されていません");
                return;
            }
            showLoading(true);
            const date = document.getElementById('target-date').value;
            const payload = {
                date: date,
                data: {
                    events: {
                        chemo: { check: document.getElementById('event-chemo').checked, time: document.getElementById('event-chemo-time').value },
                        test: { check: document.getElementById('event-test').checked, time: document.getElementById('event-test-time').value },
                        hospital: { check: document.getElementById('event-hospital').checked, time: document.getElementById('event-hospital-time').value }
                    },
                    weight: document.getElementById('weight').value,
                    temp: {
                        morning: document.getElementById('temp-morning').value,
                        noon: document.getElementById('temp-noon').value,
                        evening: document.getElementById('temp-evening').value,
                        night: document.getElementById('temp-night').value
                    },
                    food: times.reduce((acc, t) => {
                        acc[t] = {
                            qty: document.getElementById(`food-${t}-qty`).value,
                            sasami: document.getElementById(`food-${t}-sasami`).value,
                            done: document.getElementById(`food-${t}-done`).checked
                        };
                        return acc;
                    }, {}),
                    urine: times.reduce((acc, t) => {
                        acc[t] = document.querySelector(`input[name="urine-${t}"]:checked`).value;
                        return acc;
                    }, {}),
                    stool: {
                        morning: document.getElementById('stool-morning').checked,
                        evening: document.getElementById('stool-evening').checked,
                        condition: document.getElementById('stool-condition').value
                    },
                    memo: document.getElementById('daily-memo').value
                }
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showToast("スプレッドシートに保存しました");
                fetchAllData();
            } catch (e) {
                showToast("保存エラー");
            } finally {
                showLoading(false);
            }
        }

        function loadDateData(dateStr) {
            const record = allRecords.find(r => r.id === dateStr);
            resetForm();
            if (!record) return;

            const ev = record.events || {};
            document.getElementById('event-chemo').checked = ev.chemo?.check || false;
            document.getElementById('event-chemo-time').value = ev.chemo?.time || '';
            document.getElementById('event-test').checked = ev.test?.check || false;
            document.getElementById('event-test-time').value = ev.test?.time || '';
            document.getElementById('event-hospital').checked = ev.hospital?.check || false;
            document.getElementById('event-hospital-time').value = ev.hospital?.time || '';

            document.getElementById('weight').value = record.weight || '';
            document.getElementById('temp-morning').value = record.temp?.morning || '';
            document.getElementById('temp-noon').value = record.temp?.noon || '';
            document.getElementById('temp-evening').value = record.temp?.evening || '';
            document.getElementById('temp-night').value = record.temp?.night || '';

            times.forEach(t => {
                const f = record.food?.[t] || {};
                document.getElementById(`food-${t}-qty`).value = f.qty || '';
                document.getElementById(`food-${t}-sasami`).value = f.sasami || '';
                document.getElementById(`food-${t}-done`).checked = f.done || false;
                const ur = record.urine?.[t] || 'normal';
                document.querySelector(`input[name="urine-${t}"][value="${ur}"]`).checked = true;
            });

            document.getElementById('stool-morning').checked = record.stool?.morning || false;
            document.getElementById('stool-evening').checked = record.stool?.evening || false;
            document.getElementById('stool-condition').value = record.stool?.condition || "1";
            document.getElementById('daily-memo').value = record.memo || '';
        }

        function resetForm() {
            document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
            document.querySelectorAll('input[type="number"], input[type="time"], textarea').forEach(i => i.value = '');
            times.forEach(t => document.querySelector(`input[name="urine-${t}"][value="normal"]`).checked = true);
            document.getElementById('stool-condition').value = "1";
        }

        function renderHistory() {
            renderCalendar();
            renderChart();
            
            const list = document.getElementById('history-list');
            const sorted = [...allRecords].reverse();
            list.innerHTML = sorted.map(r => {
                const totalFood = times.reduce((s,t) => s + (parseFloat(r.food?.[t]?.qty) || 0), 0);
                const totalSasami = times.reduce((s,t) => s + (parseFloat(r.food?.[t]?.sasami) || 0), 0);
                return `
                    <div class="card poop-level-${r.stool?.condition || 1} border-l-8 cursor-pointer" onclick="editDate('${r.id}')">
                        <div class="flex justify-between font-bold mb-1">
                            <span class="text-indigo-900">${r.id}</span>
                            <span class="text-indigo-600">${r.weight || '--'} kg</span>
                        </div>
                        <div class="text-[10px] text-gray-500 flex gap-4">
                            <span>通常: ${totalFood}g</span>
                            <span>ささみ: ${totalSasami}g</span>
                            <span>便: ${r.stool?.morning ? '朝◯' : '朝×'} / ${r.stool?.evening ? '夕◯' : '夕×'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-title');
            const y = calendarDate.getFullYear(), m = calendarDate.getMonth();
            title.innerText = `${y}年 ${m + 1}月`;
            grid.innerHTML = ['日','月','火','水','木','金','土'].map(d => `<div class="calendar-header">${d}</div>`).join('');
            
            const first = new Date(y, m, 1).getDay();
            const last = new Date(y, m + 1, 0).getDate();
            for(let i=0; i<first; i++) grid.innerHTML += `<div class="calendar-day opacity-20"></div>`;
            
            for(let d=1; d<=last; d++) {
                const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const rec = allRecords.find(r => r.id === dStr);
                let evs = '';
                if(rec?.events?.chemo?.check) evs += `<div class="cal-event-item bg-ev-chemo">💊</div>`;
                if(rec?.events?.test?.check) evs += `<div class="cal-event-item bg-ev-test">🏥</div>`;
                grid.innerHTML += `
                    <div class="calendar-day cursor-pointer hover:bg-gray-50" onclick="editDate('${dStr}')">
                        <span class="day-num font-bold">${d}</span>
                        <div class="flex flex-wrap gap-1 mt-1">${evs}</div>
                    </div>
                `;
            }
        }

        function renderChart() {
            const ctx = document.getElementById('healthChart').getContext('2d');
            const labels = allRecords.map(r => r.id.slice(5));
            const foodData = allRecords.map(r => times.reduce((s,t) => s + (parseFloat(r.food?.[t]?.qty)||0) + (parseFloat(r.food?.[t]?.sasami)||0), 0));
            
            if(chartObj) chartObj.destroy();
            chartObj = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: '総食事量(g)', data: foodData, borderColor: '#4f46e5', tension: 0.1, fill: false }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function editDate(d) {
            document.getElementById('target-date').value = d;
            loadDateData(d);
            switchTab('input');
        }

        function changeMonth(n) { calendarDate.setMonth(calendarDate.getMonth() + n); renderCalendar(); }

        function switchTab(t) {
            document.getElementById('section-input').classList.toggle('hidden', t !== 'input');
            document.getElementById('section-history').classList.toggle('hidden', t !== 'history');
            document.getElementById('tab-input').classList.toggle('tab-active', t === 'input');
            document.getElementById('tab-history').classList.toggle('tab-active', t === 'history');
            if(t === 'history') renderHistory();
        }

        function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }
        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 2000);
        }

        document.getElementById('target-date').onchange = (e) => loadDateData(e.target.value);
        window.onload = () => { initUI(); fetchAllData(); };
    </script>
</body>
</html>
